id: github-caverns
version: 1
title: GitHub Caverns
short_title: GitHub
summary: Connect issues, pull requests, commits, CI results, and test evidence into a traceable delivery record.
order: 40
accent: violet
icon: github
outcomes:
  - Read assigned Issues into local context using the narrowest token scope that answers the question.
  - Record the links from an issue to the pull requests, commits, and issues that answer it, so the thread from request to delivery can be followed.
  - Report what could not be read, and what disappeared between runs, instead of dropping it silently.
tags: [github, integration, traceability]
