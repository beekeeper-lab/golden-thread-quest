# Optional but recommended: `pre-commit install` runs the fast half of `make check` on commit.
# Nothing here is hidden — every hook is a command you can also run yourself from the Makefile.
repos:
  - repo: local
    hooks:
      # Verify, never rewrite. A hook that reformats during `git commit` changes the
      # content under the commit the developer just reviewed, and CI runs --check anyway,
      # so a mutating hook can only hide a difference rather than prevent one.
      # Run `make format` yourself when this fails.
      - id: ruff-format
        name: ruff format --check
        entry: .venv/bin/ruff format --check
        language: system
        types: [python]
      - id: ruff-check
        name: ruff check
        entry: .venv/bin/ruff check
        language: system
        types: [python]
      - id: yaml-safe
        name: yaml safe_load only (ADR-025)
        entry: .venv/bin/python tools/check_yaml_safe.py
        language: system
        pass_filenames: false
      - id: secret-scan
        name: secret scan
        entry: .venv/bin/python tools/secret_scan.py
        language: system
        pass_filenames: true
